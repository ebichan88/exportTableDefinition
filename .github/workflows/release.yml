name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'sample/**'
      - '.gitignore'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Gradle
        shell: cmd
        run: gradlew.bat build

      # 依存ライブラリ（JDBCドライバ、log4j、Guice等）が実際に使用するJDKモジュールを検出する。
      # jdk.crypto.ec / jdk.charsets / jdk.unsupported はリフレクションやSPI経由で使われ
      # jdeps検出から漏れやすいため明示的に追加する（jdk.charsetsは日本語(Shift_JIS等)の
      # 文字コード対応に必須）。
      - name: Detect required JDK modules
        id: jdeps
        shell: pwsh
        run: |
          $jar = "build/libs/exportTableDefinition-1.0-SNAPSHOT.jar"
          $detected = (& "$env:JAVA_HOME\bin\jdeps.exe" --ignore-missing-deps --print-module-deps --multi-release 21 $jar | Select-Object -Last 1).Trim()
          $modules = "$detected,jdk.crypto.ec,jdk.charsets,jdk.unsupported"
          Write-Host "Required modules: $modules"
          "modules=$modules" >> $env:GITHUB_OUTPUT

      - name: Prepare release folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path release | Out-Null

      - name: Build custom Java runtime (jlink)
        shell: pwsh
        run: |
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --module-path "$env:JAVA_HOME\jmods" `
            --add-modules "${{ steps.jdeps.outputs.modules }}" `
            --strip-debug --no-header-files --no-man-pages --compress=2 `
            --output release/runtime

      - name: Assemble release package
        shell: pwsh
        run: |
          Copy-Item build/libs/exportTableDefinition-1.0-SNAPSHOT.jar release/
          Copy-Item -Recurse build/libs/conf release/conf
          Copy-Item README.md release/
          Copy-Item scripts/run.bat release/

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath exportTableDefinition-windows.zip -Force

      - name: Publish/overwrite "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest exportTableDefinition-windows.zip \
            --title "Latest build ($(date -u +'%Y-%m-%d %H:%M UTC'))" \
            --notes "main ブランチの最新コミット (${{ github.sha }}) から自動生成されたビルドです。Java実行環境なしでそのまま実行できます（run.bat を実行してください）。" \
            --target "${{ github.sha }}"
