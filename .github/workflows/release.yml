name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'sample/**'
      - '.gitignore'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            archive: exportTableDefinition-windows.zip
          - os: ubuntu-latest
            platform: linux
            archive: exportTableDefinition-linux.zip
          - os: macos-latest
            platform: macos
            archive: exportTableDefinition-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Gradle (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: gradlew.bat build generateLicenseReport

      - name: Build with Gradle (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew build generateLicenseReport

      # 依存ライブラリ（JDBCドライバ、log4j、Guice、MCPのSDK等）が実際に使用するJDKモジュールを検出する。
      # cliとMCPサーバーで同梱のJava実行環境（runtime）を共有するため、両方のjarを渡して必要なモジュールを合算する。
      # jdk.crypto.ec / jdk.charsets / jdk.unsupported はリフレクションやSPI経由で使われ
      # jdeps検出から漏れやすいため明示的に追加する（jdk.charsetsは日本語(Shift_JIS等)の
      # 文字コード対応に必須）。
      - name: Detect required JDK modules (Windows)
        if: matrix.platform == 'windows'
        id: jdeps_windows
        shell: pwsh
        run: |
          $jars = @("cli/build/libs/exportTableDefinition-1.0-SNAPSHOT.jar", "mcp-server/build/libs/exportTableDefinition-mcp.jar")
          $detected = (& "$env:JAVA_HOME\bin\jdeps.exe" --ignore-missing-deps --print-module-deps --multi-release 21 @jars | Select-Object -Last 1).Trim()
          $modules = "$detected,jdk.crypto.ec,jdk.charsets,jdk.unsupported"
          Write-Host "Required modules: $modules"
          "modules=$modules" >> $env:GITHUB_OUTPUT

      - name: Detect required JDK modules (Unix)
        if: matrix.platform != 'windows'
        id: jdeps_unix
        shell: bash
        run: |
          jars=("cli/build/libs/exportTableDefinition-1.0-SNAPSHOT.jar" "mcp-server/build/libs/exportTableDefinition-mcp.jar")
          detected=$("$JAVA_HOME/bin/jdeps" --ignore-missing-deps --print-module-deps --multi-release 21 "${jars[@]}" | tail -1 | tr -d '\r')
          modules="$detected,jdk.crypto.ec,jdk.charsets,jdk.unsupported"
          echo "Required modules: $modules"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

      - name: Prepare release folder
        shell: bash
        run: mkdir -p release

      - name: Build custom Java runtime (jlink) (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --module-path "$env:JAVA_HOME\jmods" `
            --add-modules "${{ steps.jdeps_windows.outputs.modules }}" `
            --strip-debug --no-header-files --no-man-pages --compress=2 `
            --output release/runtime

      - name: Build custom Java runtime (jlink) (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          "$JAVA_HOME/bin/jlink" \
            --module-path "$JAVA_HOME/jmods" \
            --add-modules "${{ steps.jdeps_unix.outputs.modules }}" \
            --strip-debug --no-header-files --no-man-pages --compress=2 \
            --output release/runtime

      # MITの条件である著作権表示（LICENSE）と、jarに同梱した依存ライブラリのライセンス（本文・NOTICEを含む）を配布物に入れる。
      # JDKのライセンスは、jlinkがruntime/legalに入れる
      - name: Assemble release package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Copy-Item cli/build/libs/exportTableDefinition-1.0-SNAPSHOT.jar release/
          Copy-Item -Recurse cli/build/libs/conf release/conf
          Copy-Item README.md release/
          Copy-Item LICENSE release/
          Copy-Item cli/build/reports/dependency-license/THIRD-PARTY-NOTICES.txt release/
          Copy-Item scripts/run.bat release/
          New-Item -ItemType Directory -Force release/mcp | Out-Null
          Copy-Item mcp-server/build/libs/exportTableDefinition-mcp.jar release/mcp/
          Copy-Item mcp-server/build/reports/dependency-license/THIRD-PARTY-NOTICES.txt release/mcp/

      - name: Assemble release package (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cp cli/build/libs/exportTableDefinition-1.0-SNAPSHOT.jar release/
          cp -r cli/build/libs/conf release/conf
          cp README.md release/
          cp LICENSE release/
          cp cli/build/reports/dependency-license/THIRD-PARTY-NOTICES.txt release/
          cp scripts/run.sh release/
          mkdir -p release/mcp
          cp mcp-server/build/libs/exportTableDefinition-mcp.jar release/mcp/
          cp mcp-server/build/reports/dependency-license/THIRD-PARTY-NOTICES.txt release/mcp/
          chmod +x release/run.sh release/runtime/bin/java

      - name: Create ZIP (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath ${{ matrix.archive }} -Force

      - name: Create ZIP (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: (cd release && zip -r "../${{ matrix.archive }}" .)

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Publish/overwrite "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest artifacts/*/*.zip \
            --title "Latest build ($(date -u +'%Y-%m-%d %H:%M UTC'))" \
            --notes "main ブランチの最新コミット (${{ github.sha }}) から自動生成されたビルドです。Java実行環境なしでそのまま実行できます（Windowsはrun.bat、Linux/macOSはrun.shを実行してください）。" \
            --target "${{ github.sha }}"
