name: CI

# PRごとに、単体テスト・フォーマットの検査（build）と、Docker上の実DBに対する結合テスト（integrationTest・oracleIntegrationTest）を行う。
# docs/sample配下（DDL・ベースライン）は結合テストの入力のため、docsの変更でも実行する。
# release.ymlも、リリースの前にこのワークフローを呼び出し、テストに通った場合だけ配布物を作る
on:
  pull_request:
  push:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    # 結合テストはDockerを使うため、Dockerが使えるLinuxのランナーで実行する
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # gradlew実行前に、gradle-wrapper.jarがGradle公式のものか（PRで差し替えられていないか）をチェックサムで確かめる
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # build（test含む）の中で、cliのドメイン層・mcp-serverのcatalogのカバレッジが各build.gradleに定めた基準を下回ると
      # jacocoTestCoverageVerificationが失敗し、buildごと失敗する。
      # javadocは、doclintで壊れたJavadoc（タグの誤り・参照先の無いリンク等）を検知するために実行する。
      # generateLicenseReportは、release.ymlが配布物に入れるライセンスの一覧を作れなくなっていないかを、マージ前に確かめるために実行する
      - name: Build and run tests
        run: |
          chmod +x ./gradlew
          ./gradlew build javadoc integrationTest generateLicenseReport --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            cli/build/reports/tests/
            mcp-server/build/reports/tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-coverage-report
          path: |
            cli/build/reports/jacoco/test/html/
            mcp-server/build/reports/jacoco/test/html/

      # PRに単体テストのカバレッジをコメントする。
      # forkからのPRはGITHUB_TOKENが読み取り専用で投稿が失敗し、ジョブごと赤になるため実行しない（カバレッジはアーティファクトで見られる）
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: madrapps/jacoco-report@7c362aca34caf958e7b1c03464bd8781db9f8da7 # v1.7.1
        with:
          paths: cli/build/reports/jacoco/test/jacocoTestReport.xml,mcp-server/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: カバレッジレポート（単体テスト）
          update-comment: true

  # Oracleの結合テストはイメージ（約1.3GB）の取得とDBの起動に時間がかかるため、別のジョブで並行して実行する
  oracle-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # gradlew実行前に、gradle-wrapper.jarがGradle公式のものか（PRで差し替えられていないか）をチェックサムで確かめる
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run Oracle integration tests
        run: |
          chmod +x ./gradlew
          ./gradlew :cli:oracleIntegrationTest --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oracle-test-reports
          path: cli/build/reports/tests/oracleIntegrationTest/
