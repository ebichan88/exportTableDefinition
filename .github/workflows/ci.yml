name: CI

# PRごとに、単体テスト・フォーマットの検査（build）と、Docker上の実DBに対する結合テスト（integrationTest）を行う。
# docs/sample/postgres配下（DDL・ベースライン）は結合テストの入力のため、docsの変更でも実行する
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    # 結合テストはDockerを使うため、Dockerが使えるLinuxのランナーで実行する
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # build（test含む）の中で、ドメイン層のカバレッジがAGENTS.mdに定めた基準を下回ると
      # jacocoTestCoverageVerificationが失敗し、buildごと失敗する
      - name: Build and run tests
        run: |
          chmod +x ./gradlew
          ./gradlew build integrationTest --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/html/

      # PRに単体テストのカバレッジをコメントする（forkからのPRはGITHUB_TOKENが読み取り専用のため投稿できない）
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: カバレッジレポート（単体テスト）
          update-comment: true
