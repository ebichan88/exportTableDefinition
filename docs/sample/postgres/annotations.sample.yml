# テーブル定義書へマージする手動付帯情報（サイドカー）のサンプル。
# conf/ExportTableDefinition.properties の annotationPath にこのファイルのパスを指定すると、
# テーブル定義書の再生成時に以下の付帯情報がマージされ、手書き情報が上書きで失われるのを防げます。
#
# キーは物理名（スキーマ名.物理テーブル名、カラムは物理カラム名）で指定します。
# ddl.sql では sample.department にDBコメント（COMMENT ON TABLE/COLUMN）を付与していません。
# ここで論理名の代わりとなる説明・備考を補い、DBコメントとサイドカーの両方の使い分けを
# サンプルとして示しています。
tables:
  sample.department:
    # 「テーブル説明」セクションへ出力されます（複数行可）。
    description: |
      社内の組織単位を管理するマスタテーブル。
      従業員（employee）は必ずいずれか1つの部署に所属する。
    # 「テーブル情報」表の備考セルへ出力されます。
    remarks: 組織改編時はdepartment_codeを変更せず、department_nameのみ更新すること
    # 物理カラム名をキーに、各カラムの備考を記述します（「カラム情報」表の備考セル）。
    columns:
      department_code: 部署コード。他システム連携時のキーとして使用
      department_name: 部署名称
  sample.audit_log:
    description: employeeテーブルの変更を記録する監査ログ。トリガー経由でのみ書き込まれる。
    remarks: アプリケーションからの直接INSERTは禁止
    columns:
      table_name: 変更対象のテーブル名
      record_id: 変更対象の主キー値
      action: 変更種別（INSERT / UPDATE / DELETE）
      changed_by: 変更を行ったDBユーザー
      # 改行や | を含んでいても、表を崩さないよう自動でエスケープされます。
      changed_at: |
        変更日時
        （サーバータイムゾーン基準 | UTC変換は未実施）

# DBに外部キー制約が存在しないテーブル間の「論理リレーション」を宣言します。
# アプリケーション側で参照整合性を担保しているなどの理由でFK制約を張らないDBでは、
# カタログから読み取れる関連だけではER図がほとんど空になるため、ここで関連を補います。
#
# 宣言した関連は以下に反映されます。
#   * 参照元テーブル定義書の「論理リレーション情報」セクション（外部キー情報とは別セクション）
#   * 各テーブル定義書のER図・スキーマ別ER図（物理FKの実線に対し、破線で描画）
#
# ddl.sql の sample.audit_log は「単独テーブル（関連なし）」としてFK制約を持ちません。
# record_id は変更対象テーブルの主キー値を入れる多態的なカラムのため制約を張れませんが、
# 実運用上は employee を指すため、ここで論理リレーションとして宣言しています。
relations:
  - table: sample.audit_log            # 参照元（子）。スキーマ名.物理テーブル名
    columns: [record_id]               # 参照元のカラム（単一の場合は record_id のようにスカラーでも可）
    parentTable: sample.employee       # 参照先（親）
    parentColumns: [employee_id]       # 参照先のカラム
    # 関連名。省略時は「テーブル名_カラム名_lrel」（この例では audit_log_record_id_lrel）を自動生成します。
    name: rel_audit_log_employee
    # 多重度。DBに制約が無く機械的に判定できないため、ここで明示できます。
    # 指定できる値: 1対多 / 0..1対多 / 1対1 / 0..1対1 ※省略時・未知の値は 1対多 とみなします。
    cardinality: 0..1対多

# 業務ドメイン別にテーブルをまとめる「観点」を宣言します。
# スキーマ単位・関連で繋がったまとまり（グループ）単位の機械的な分割とは別に、人が読む単位で
# テーブルを束ねたページ（観点ごとのER図・所属テーブルの一覧）と、観点一覧が出力されます。
# 所属するテーブルの定義書には「所属する観点」として観点ページへのリンクが付きます。
viewpoints:
  - id: personnel                    # 識別子。観点ページのファイル名（viewpoint_{DB名}_{id}.md）に使います（英数字・-・_のみ）
    name: 人事管理                    # 表示名（省略時は識別子）
    description: |                   # 観点ページの「説明」セクションへ出力されます（複数行可。観点一覧には1行目のみ）
      従業員と、その所属・付帯情報を扱うテーブル群。
      プロジェクトへのアサインは「プロジェクト管理」の観点を参照。
    # 所属テーブルは table= と同じ記法（ワイルドカード・除外・スキーマ修飾）で指定します。
    # 先頭の ! や * はYAMLの記号として解釈されるため、引用符で囲んでください。
    tables:
      - sample.employee*
      - "!sample.employee_directory_view"
      - sample.department
      - sample.parking_spot
  - id: project
    name: プロジェクト管理
    description: プロジェクトと要員のアサインを扱うテーブル群。
    # 1つのテーブルが複数の観点に所属してもかまいません（employee は人事管理にも所属）。
    tables: [sample.project*, sample.employee]
  - id: logistics
    name: 物流
    tables: [sample.shipment, sample.warehouse_zone]
