plugins {
    id 'java'
    id 'jacoco'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'com.diffplug.spotless' version '8.8.0'
}

group 'exportTableDefinition'
version '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

// 結合テスト（Docker上の実DBに対してmapperのSQLと出力全体を検証する）は、Dockerが無い環境でも
// 単体テスト（test）を実行できるよう、別のソースセット・タスクに分ける
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.mybatis:mybatis:3.5.16'
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation("com.oracle.database.jdbc:ojdbc8:19.18.0.0")
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.24.0'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.24.0'
    implementation group: 'com.google.inject', name: 'guice', version: '7.0.0'
    // Guice固有の@Injectではなく標準のjakarta.injectを用い、ドメイン層をDIコンテナ実装から切り離す
    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
    implementation 'org.yaml:snakeyaml:2.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    // 結合テスト（integrationTest）だけが使う。Docker上に使い捨てのPostgreSQLを起動する
    integrationTestImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    integrationTestImplementation 'org.testcontainers:testcontainers-postgresql'
}

test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
        events 'failed'
    }
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.12'
}

// 単体テスト（DB不要）のカバレッジのみを対象とする。結合テストはmapperのSQLと出力全体の
// 突き合わせが目的で、Dockerが無い環境では実行できないため、カバレッジ基準には含めない
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// ドメイン層（ルールを持つ中心的なロジック）のみ、単体テストのカバレッジに最低基準を設ける。
// domain以外の層（インフラのDB/ファイルI/O等）は結合テストや手動確認で担保するため対象外。
// 現状の実績（line 99%・branch 95%超）を下回ったら気づけるよう、実績より少し低い値を基準にする
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'BUNDLE'
            includes = ['com.export_table_definition.domain.*']
            limit {
                counter = 'LINE'
                minimum = 0.95
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.85
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests against a disposable PostgreSQL on Docker (requires Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
        events 'failed'
    }
}

// PropertyLoaderはconfディレクトリをファイルシステムパスとして直接参照するため、
// テスト専用のプロパティファイルもsrc/main/resources/conf配下に置いているが、
// ビルド成果物（jar・配布用confディレクトリ）には含めない
processResources {
    exclude('conf/PropertyLoaderTestFixture.properties')
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.export_table_definition.ExportTableDefinition'
        )
    }
	exclude('/conf/mybatis.properties')
}

tasks.named('build').configure {
    dependsOn(tasks.named('shadowJar'))
}

shadowJar {
    archiveClassifier.set('') // 実行可能JARを作成（デフォルトの「-all」サフィックスを削除）
}

task copyResources(type: Copy) {
    from 'src/main/resources/conf'
    into "$buildDir/../build/libs/conf"
    exclude('PropertyLoaderTestFixture.properties')
}

javadoc {
    options.charSet = 'UTF-8'
    options.encoding = 'UTF-8'
    destinationDir = file("docs/javadoc")
}

build.dependsOn(copyResources)

spotless {
    java {
        googleJavaFormat('1.27.0')
        // static importを第1グループ、それ以外をASCII辞書順の1グループとする
        importOrder('\\#', '')
        removeUnusedImports()
    }
}
