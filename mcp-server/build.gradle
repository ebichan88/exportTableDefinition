plugins {
    id 'jacoco'
    id 'com.gradleup.shadow'
}

dependencies {
    // mcp（バンドル版）はJackson 3を同梱するため、cliと同じJackson 2系で揃えるcore＋jackson2の組み合わせを使う
    implementation 'io.modelcontextprotocol.sdk:mcp-core:2.0.1'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2:2.0.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    // SDKのログ（SLF4J）の出力先。標準出力はMCPのプロトコルが使うため、標準エラーへ出すsimpleを使う
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.20'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.dbxray.mcp.McpServerMain',
            'Implementation-Version': project.version)
    }
}

shadowJar {
    // MCPクライアントの設定に書くパスが更新で変わらないよう、バージョンを含めない固定名にする
    archiveFileName = 'dbxray-mcp.jar'
    // SDKは入力スキーマの検証器（JsonSchemaValidator）をServiceLoaderで探す（JSONマッパーはMcpServerMainで明示的に渡す）ため、依存jarのMETA-INF/servicesを結合して残す
    mergeServiceFiles()
}

tasks.named('build').configure {
    dependsOn(tasks.named('shadowJar'))
}

test {
    // E2Eテストは、配布するjarそのものを子プロセスで起動して確かめる
    dependsOn(tasks.named('shadowJar'))
    systemProperty 'mcpServerJar', tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath
    // ベースライン（cliが出力したサンプルのスナップショット）を、形式の互換を確かめる契約テストの入力にする
    systemProperty 'sampleSnapshotDir', rootProject.file('docs/sample/postgres/output/snapshot').absolutePath
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}


// 検索・関連のたどりのルールを持つcatalogのみ、単体テストのカバレッジに最低基準を設ける（cliのドメイン層と同じ考え方）。
// 現状の実績（line 99%・branch 92%）を下回ったら気づけるよう、cliと同じく実績より少し低い値を基準にする
jacocoTestCoverageVerification {
    dependsOn test
    // 対象のパッケージは検査するクラスの範囲で絞る。BUNDLEのincludesはクラスではなくバンドル（プロジェクト）名に
    // 照合されるため、クラスのパターンを書くとルールがどのクラスにも当てはまらず、基準を下回っても失敗しない
    classDirectories.setFrom(sourceSets.main.output.classesDirs.collect {
        fileTree(it) { include 'com/dbxray/mcp/catalog/**' }
    })
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.95
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.85
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
