# テーブル定義書へマージする手動付帯情報（サイドカー）のサンプル。
# conf/ExportTableDefinition.properties の annotationPath にこのファイルのパスを指定すると、
# テーブル定義書の再生成時に以下の付帯情報がマージされ、手書き情報が上書きで失われるのを防げます。
#
# キーは物理名（スキーマ名.物理テーブル名、カラムは物理カラム名）で指定します。
tables:
  public.users:
    # 「テーブル説明」セクションへ出力されます（複数行可）。
    description: |
      ユーザーの基本情報を保持するテーブル。
      認証情報（credentials）と1対1で紐づく。
    # 「テーブル情報」表の備考セルへ出力されます。
    remarks: 個人情報を含むため取り扱い注意
    # 物理カラム名をキーに、各カラムの備考を記述します（「カラム情報」表の備考セル）。
    columns:
      email: ログインID兼用。ユニーク制約あり
      status: 区分値（0=無効 / 1=有効）
      # 改行や | を含んでいても、表を崩さないよう自動でエスケープされます。
      note: |
        補足1
        補足2（区切り: a|b）
  public.orders:
    description: 注文ヘッダ。明細は order_items を参照。
    columns:
      total_amount: 税込金額（円）
